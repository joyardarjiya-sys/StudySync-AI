
name: StudySync AI CI

on:
  push:
    branches:
      - feature/rag
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/**"
  pull_request:
    branches:
      - feature/rag
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/**"

jobs:
  frontend-build:
    name: Build React frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
