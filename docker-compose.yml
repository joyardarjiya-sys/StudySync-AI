services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: studysync-backend
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    volumes:
      - ./backend/data:/app/backend/data
    expose:
      - "8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: studysync-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
